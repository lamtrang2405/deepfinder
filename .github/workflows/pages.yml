name: Deploy DeepFinder to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: deepfinder_app
        run: flutter pub get

      - name: Build web (GitHub Pages)
        working-directory: deepfinder_app
        run: flutter build web --release --base-href /deepfinder/

      - name: Publish onboarding (pencil-mobile.html) on Pages
        run: |
          # Flutter copies deepfinder_app/web/* into build/web; optional root override
          if [ -f pencil-mobile.html ]; then cp -f pencil-mobile.html deepfinder_app/build/web/pencil-mobile.html; fi
          test -f deepfinder_app/build/web/pencil-mobile.html || { echo "pencil-mobile.html missing (add deepfinder_app/web/pencil-mobile.html or repo-root pencil-mobile.html)"; exit 1; }
          # Site entry → pencil-mobile (not pencil-new)
          cat > deepfinder_app/build/web/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>DeepFinder</title>
            <link rel="canonical" href="./pencil-mobile.html" />
            <meta http-equiv="refresh" content="0; url=./pencil-mobile.html" />
          </head>
          <body>
            <p>Redirecting to <a href="./pencil-mobile.html">onboarding</a>…</p>
          </body>
          </html>
          EOF
          # Old links / cached workflows pointed here — forward to pencil-mobile
          cat > deepfinder_app/build/web/pencil-new.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Redirecting…</title>
            <link rel="canonical" href="./pencil-mobile.html" />
            <meta http-equiv="refresh" content="0; url=./pencil-mobile.html" />
          </head>
          <body>
            <p><a href="./pencil-mobile.html">Open onboarding</a></p>
          </body>
          </html>
          EOF
          grep -q 'pencil-mobile.html' deepfinder_app/build/web/index.html || { echo "index.html must redirect to pencil-mobile.html"; exit 1; }
          test -f deepfinder_app/build/web/pencil-mobile.html || { echo "pencil-mobile.html missing"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deepfinder_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

